<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VF3 Scanner</title><link rel="stylesheet" href="styles.css"></head><body><main><header class="brand"><span>VF3 <b>Scanner</b></span><a href="admin.html">Admin</a></header><section><h1>Check ticket</h1><form id="scan-form"><label>Ticket code<input id="code" required placeholder="VF3-XXXXXXXXXX" autofocus></label><p class="err" id="result" role="status"></p><button class="cta">Validate entry</button></form></section></main><script>document.getElementById('scan-form').onsubmit=async function(e){e.preventDefault();var r=await fetch('/api/admin/scan',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({code:document.getElementById('code').value})}),d=await r.json();var out=document.getElementById('result');out.textContent=r.ok?'Valid ticket. Reference: '+d.reference:(d.error||'Invalid ticket');if(r.ok)document.getElementById('code').value=''};</script></body></html>
